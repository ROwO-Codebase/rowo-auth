name = "rowo-auth"
main = "worker.js"
compatibility_date = "2026-04-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Set this in CI or locally before deploy:
# CLOUDFLARE_ACCOUNT_ID=your_account_id
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

[[d1_databases]]
binding = "auth_database"
database_name = "rowo-auth-db"
database_id = "YOUR_D1_DATABASE_ID"

[vars]
ADFS_PROVIDER_ENDPOINT = "https://adfs.example.edu/login"
ALLOWED_EMAIL_DOMAIN = "uwaterloo.ca"
AWS_REGION = "us-east-1"
CORS_ALLOW_ORIGINS = "https://rowo.link,https://developers.rowo.link,http://localhost:5173,http://localhost:5174"
DISCORD_CLIENT_ID = ""
DISCORD_REDIRECT_URI = "https://rowo.link/verify/discord/callback"
EMAIL_SENDS_PER_MINUTE = "60"
GITHUB_CLIENT_ID = ""
GITHUB_REDIRECT_URI = "https://rowo.link/verify/github/callback"
SES_FROM_EMAIL = "verification@rowo.link"
SES_FROM_NAME = "ROwO Auth"
WEBAUTHN_ALLOWED_ORIGINS = "https://rowo.link,http://localhost:5173"
# GITHUB_CLIENT_SECRET, DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN,
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, SENSITIVE_DATA_HASH_SECRET,
# ADFS_JWT_SECRET, ROWO_AUTH_JWT_SECRET, TWO_FACTOR_ENC_KEY
# must be set as Wrangler secrets (wrangler secret put ...).
# ROWO_AUTH_JWT_SECRET: 32+ random bytes (base64). Used to sign ROwO Account
# session JWTs and bind tokens. Generate with: openssl rand -base64 48
# TWO_FACTOR_ENC_KEY: exactly 32 random bytes (base64) used as the AES-GCM
# key that encrypts each user's TOTP secret at rest. Generate with:
# openssl rand -base64 32

[env.production]
name = "rowo-auth"
compatibility_flags = ["nodejs_compat"]

[[env.production.d1_databases]]
binding = "auth_database"
database_name = "rowo-auth-db"
database_id = "YOUR_PRODUCTION_D1_DATABASE_ID"

[env.production.vars]
ADFS_PROVIDER_ENDPOINT = "https://adfs.example.edu/login"
ALLOWED_EMAIL_DOMAIN = "uwaterloo.ca"
AWS_REGION = "us-east-1"
CORS_ALLOW_ORIGINS = "https://rowo.link,https://developers.rowo.link,http://localhost:5173,http://localhost:5174"
DISCORD_CLIENT_ID = ""
DISCORD_REDIRECT_URI = "https://rowo.link/verify/discord/callback"
EMAIL_SENDS_PER_MINUTE = "60"
GITHUB_CLIENT_ID = ""
GITHUB_REDIRECT_URI = "https://rowo.link/verify/github/callback"
SES_FROM_EMAIL = "verification@rowo.link"
SES_FROM_NAME = "ROwO Auth"
WEBAUTHN_ALLOWED_ORIGINS = "https://rowo.link"
