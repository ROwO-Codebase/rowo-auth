name = "rowo-auth"
main = "worker.js"
compatibility_date = "2026-04-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
placement = { mode = "smart" }

# account_id is provided via the CLOUDFLARE_ACCOUNT_ID env var (read
# natively by Wrangler). Cloudflare Workers Builds supplies this
# automatically; locally set it via .env / shell profile.
#
# database_id uses ${VAR} placeholders that Wrangler does NOT expand on
# its own. The deploy command must template this file first, e.g.:
#   envsubst '$D1_DATABASE_ID_PREVIEW $D1_DATABASE_ID_PRODUCTION' \
#     < backend/wrangler.toml > /tmp/wrangler.toml
#   npx wrangler deploy --config /tmp/wrangler.toml [--env production]

[[d1_databases]]
binding = "auth_database"
database_name = "rowo-auth-db"
database_id = "${D1_DATABASE_ID_PREVIEW}"

[vars]
ALLOWED_EMAIL_DOMAIN = "uwaterloo.ca"
AWS_REGION = "us-east-1"
CORS_ALLOW_ORIGINS = "https://rowo.link,https://developers.rowo.link,https://preview.rowo.link,https://developers-preview.rowo.link"
DISCORD_REDIRECT_URI = "https://rowo.link/verify/discord/callback"
EMAIL_SENDS_PER_MINUTE = "60"
GITHUB_REDIRECT_URI = "https://rowo.link/verify/github/callback"
SES_FROM_EMAIL = "verification@rowo.link"
SES_FROM_NAME = "ROwO Auth"
WEBAUTHN_ALLOWED_ORIGINS = "https://rowo.link"
# The following must be set as Wrangler secrets (wrangler secret put NAME):
#   DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN,
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#   SENSITIVE_DATA_HASH_SECRET,
#   ADFS_PROVIDER_ENDPOINT, ADFS_JWT_SECRET,
#   ROWO_AUTH_JWT_SECRET, TWO_FACTOR_ENC_KEY
# ROWO_AUTH_JWT_SECRET: 32+ random bytes (base64). Used to sign ROwO Account
# session JWTs and bind tokens. Generate with: openssl rand -base64 48
# TWO_FACTOR_ENC_KEY: exactly 32 random bytes (base64) used as the AES-GCM
# key that encrypts each user's TOTP secret at rest. Generate with:
# openssl rand -base64 32

[env.production]
name = "rowo-auth"
compatibility_flags = ["nodejs_compat"]
placement = { mode = "smart" }
preview_urls = false

[[env.production.routes]]
pattern = "api.rowo.link"
zone_name = "rowo.link"
custom_domain = true

[[env.production.d1_databases]]
binding = "auth_database"
database_name = "rowo-auth-db"
database_id = "${D1_DATABASE_ID_PRODUCTION}"

[[env.production.r2_buckets]]
binding = "auth_logs_bucket"
bucket_name = "rowo-auth-logs"

[env.production.observability]
enabled = true

[env.production.observability.logs]
enabled = true

[env.production.vars]
ALLOWED_EMAIL_DOMAIN = "uwaterloo.ca"
AWS_REGION = "us-east-1"
CORS_ALLOW_ORIGINS = "https://rowo.link,https://developers.rowo.link"
DISCORD_REDIRECT_URI = "https://rowo.link/verify/discord/callback"
EMAIL_SENDS_PER_MINUTE = "60"
GITHUB_REDIRECT_URI = "https://rowo.link/verify/github/callback"
SES_FROM_EMAIL = "verification@rowo.link"
SES_FROM_NAME = "ROwO Auth"
WEBAUTHN_ALLOWED_ORIGINS = "https://rowo.link"
